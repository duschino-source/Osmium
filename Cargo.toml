[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/adapters",
    "crates/mock-cli",
    "crates/adapter-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Osmium Authors"]
license = "MIT"
repository = "https://github.com/osmium/osmium"

[workspace.dependencies]
# Internal workspace crates
osmium-core = { path = "crates/core" }
osmium-adapters = { path = "crates/adapters" }
osmium-mock-cli = { path = "crates/mock-cli" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
indexmap = { version = "2.7", features = ["serde"] }

# Async runtime & concurrency
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Utilities
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
dunce = "1.0"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6.0"
tempfile = "3.17"
